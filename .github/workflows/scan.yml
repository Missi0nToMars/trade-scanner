name: Background Trade Scanner

on:
  schedule:
    # Runs every 15 minutes. GitHub's cron is UTC-based.
    # Adjust the "*/15" if you want a different frequency.
    - cron: "*/15 * * * *"
  workflow_dispatch:  # lets you manually trigger a run from GitHub's Actions tab, for testing

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests gspread google-auth

      - name: Run scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          SHEET_NAME: ${{ secrets.SHEET_NAME }}
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          SCAN_SYMBOL: "XAU/USD"
          SCAN_INTERVAL: "15min"
          CONFIDENCE_THRESHOLD: "75"
        run: python background_scanner.py
